<style>
.btn-del-user {
    background-color: #ef4444;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
}
</style>

<script>
// YE SAFE FETCH FUNCTION DUKAN KE NETWORK KO RE-TRY KI MEMORY DEGA
async function safeFetch(url, options = {}) {
    try {
        const res = await fetch(url, options);
        if (!res.ok) {
            throw new Error("Server Error");
        }
        return await res.json();
    } catch(err) {
        console.error(err);
        alert("Network / Server Error: Dukan ka server response nahi de raha.");
        return null;
    }
}

// AAPKA REPLACED PERFECT SUMMARY TABLE HANDLER
function populateSummaryTable(jobs) {
    const tbody = document.getElementById('live-table-rows');
    tbody.innerHTML = '';

    const txt = (document.getElementById('search-box').value || '').toLowerCase();
    const filter = document.getElementById('filter-status-box').value;
    const isChairman = (CURRENT_USER_ROLE === "Chairman");

    if (!Array.isArray(jobs)) return;

    jobs.forEach(job => {
        const jid = String(job.id || '').toLowerCase();
        const jname = String(job.name || '').toLowerCase();
        const jphone = String(job.phone1 || '');

        const matchSearch = jid.includes(txt) || jname.includes(txt) || jphone.includes(txt);
        const matchStatus = filter === 'ALL' || job.status === filter;

        if (!matchSearch || !matchStatus) return;

        const tr = document.createElement('tr');
        const cStyle = String(job.status || 'Pending').replace(" ", "-");

        const finalCustomerBill = parseFloat(job.estimate || 0) + parseFloat(job.extra_cost || 0) - parseFloat(job.discount || 0);
        const spareCost = parseFloat(job.spare_part_cost || 0);
        const entryProfit = finalCustomerBill - spareCost;

        let historyLabel = '';
        if (statusHistoryCache[job.id] === 'TriggeredAlert') {
            historyLabel = `<br><span style="background:#ef4444; color:white; padding:2px 4px; font-size:10px; border-radius:3px; font-weight:bold; display:inline-block; margin-top:4px;">⚠️ Delivered → Undelivered</span>`;
        }

        tr.innerHTML = `
            <td style="font-weight:bold; color:#f97316;">${job.id}</td>
            <td style="font-size:11px; color:#9ca3af;">${job.date || ''}</td>
            <td><strong>${job.name || ''}</strong><br><small style="color:#6b7280;">${job.phone1 || ''}</small></td>
            <td><span style="background:#1f2937; padding:2px 5px; border-radius:4px; color:#f97316; font-weight:bold;">${job.category || ''}</span></td>
            <td><strong>${job.device || ''}</strong><br><small style="color:#9ca3af;">${job.problem || ''}</small></td>
            <td>
                <div style="font-size:12px; line-height:1.4; min-width:170px;">
                    <span style="font-weight:bold; color:#fff;">Bill: ₹${finalCustomerBill}</span> 
                    
                    ${isChairman ? `
                        <br>
                        <span style="color:#ef4444; font-size:11px;">Cost: </span>
                        <input type="number" style="width:60px; background:#0b0f19; border:1px solid #1f2937; color:#ef4444; font-weight:bold;" value="${spareCost}" id="tx-scost-${job.id}">
                    ` : ''}

                    ${isChairman && job.status === 'Delivered' ? `
                        <br>
                        <span style="color:#10b981; font-weight:bold;">Profit: ₹${entryProfit}</span>
                    ` : ''}

                    <div style="margin-top:4px; font-size:10px; color:#6b7280; display: ${isChairman ? 'block' : 'none'};">
                        Est: ${job.estimate} | Ext: <input type="number" style="width:55px; background:none; border:1px solid #1f2937; color:white;" value="${job.extra_cost}" id="tx-ext-${job.id}"> | Disc: <input type="number" style="width:35px; background:none; border:1px solid #1f2937; color:white;" value="${job.discount || 0}" id="tx-disc-${job.id}">
                    </div>
                </div>
            </td>
            <td style="font-weight:600; font-size:11px; color:#9ca3af;">👤 ${job.created_by || 'Staff'}</td>
            <td>
                <select class="status-dropdown status-${cStyle}" onchange="modifyStatus('${job.id}', this.value, '${job.status}')">
                    <option value="Pending" ${job.status==='Pending'?'selected':''}>Pending</option>
                    <option value="Repairing" ${job.status==='Repairing'?'selected':''}>Repairing</option>
                    <option value="Testing" ${job.status==='Testing'?'selected':''}>Testing</option>
                    <option value="Ready" ${job.status==='Ready'?'selected':''}>Ready</option>
                    <option value="Delivered" ${job.status==='Delivered'?'selected':''}>Delivered</option>
                    <option value="Not Repair" ${job.status==='Not Repair'?'selected':''}>Not Repair</option>
                    <option value="Undelivered" ${job.status==='Undelivered'?'selected':''}>Undelivered</option>
                </select>
                ${historyLabel}
            </td>
            <td>
                <div class="action-flex">
                    ${isChairman ? `<button class="tbl-btn-save" onclick="triggerPricingSave('${job.id}')">💾 Save</button>` : ''}
                    <button class="tbl-btn-print" onclick="executePortraitPrint('${job.id}')">🖨️ Bill</button>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}
</script>
