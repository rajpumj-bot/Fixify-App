<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIXIFY TECH REPAIR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:250px;
background:#111827;
padding:20px;
border-right:2px solid #f97316;
}

.logo{
font-size:28px;
font-weight:bold;
color:#f97316;
margin-bottom:30px;
text-align:center;
}

.menu-btn{
width:100%;
padding:14px;
margin-bottom:10px;
background:#1f2937;
border:none;
border-radius:8px;
color:white;
font-size:15px;
cursor:pointer;
text-align:left;
}

.menu-btn:hover{
background:#f97316;
}

.main{
flex:1;
padding:20px;
overflow:auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-bottom:20px;
border:1px solid #374151;
}

.card h2{
margin-bottom:15px;
color:#f97316;
}

.input{
width:100%;
padding:12px;
margin-bottom:12px;
background:#1f2937;
border:none;
border-radius:8px;
color:white;
}

.btn{
background:#f97316;
color:white;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
width:100%;
}

.btn:hover{
background:#ea580c;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

table th{
background:#f97316;
padding:12px;
text-align:left;
}

table td{
padding:12px;
border-bottom:1px solid #374151;
}

.login-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000dd;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.login-box{
width:350px;
background:#111827;
padding:30px;
border-radius:15px;
border:2px solid #f97316;
}

.login-title{
text-align:center;
font-size:28px;
margin-bottom:20px;
color:#f97316;
font-weight:bold;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.stat-box{
background:#111827;
padding:20px;
border-radius:12px;
text-align:center;
border-left:5px solid #f97316;
}

.stat-box h3{
font-size:30px;
margin-top:10px;
}

@media(max-width:900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow:auto;
gap:10px;
}

.menu-btn{
min-width:200px;
}

.stats{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- LOGIN SCREEN -->

<div class="login-screen" id="loginScreen">

<div class="login-box">

<div class="login-title">
FIXIFY LOGIN
</div>

<input 
type="text" 
id="username" 
class="input" 
placeholder="Username">

<input 
type="password" 
id="password" 
class="input" 
placeholder="Password">

<button class="btn" onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
FIXIFY
</div>

<button class="menu-btn">
📋 Dashboard
</button>

<button class="menu-btn">
🛠️ Create Jobcard
</button>

<button class="menu-btn">
📦 Spare Parts
</button>

<button class="menu-btn">
👨‍💼 Employees
</button>

<button class="menu-btn">
💰 Profit Report
</button>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<h1>
Mobile & Laptop Repair System
</h1>

<div style="color:#f97316;font-weight:bold;">
Chairman Panel
</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat-box">
Pending
<h3>0</h3>
</div>

<div class="stat-box">
Ready
<h3>0</h3>
</div>

<div class="stat-box">
Delivered
<h3>0</h3>
</div>

</div>

<!-- CREATE JOBCARD -->

<div class="card">

<h2>Create Repair Jobcard</h2>

<input 
type="text" 
class="input" 
placeholder="Customer Name">

<input 
type="text" 
class="input" 
placeholder="Phone Number">

<select class="input">
<option>Mobile</option>
<option>Laptop</option>
</select>

<input 
type="text" 
class="input" 
placeholder="Device Model">

<input 
type="text" 
class="input" 
placeholder="IMEI / Serial Number">

<input 
type="text" 
class="input" 
placeholder="PIN / Pattern Lock">

<input 
type="text" 
class="input" 
placeholder="Problem">

<input 
type="number" 
class="input" 
placeholder="Estimate Amount">

<input 
type="number" 
class="input" 
placeholder="Advance Payment">

<button class="btn">
SAVE JOBCARD
</button>

</div>

<!-- TABLE -->

<div class="card">

<h2>Repair Records</h2>

<table>

<thead>

<tr>
<th>ID</th>
<th>Customer</th>
<th>Device</th>
<th>Status</th>
<th>Amount</th>
</tr>

</thead>

<tbody>

<tr>
<td>FIX001</td>
<td>Rahul</td>
<td>iPhone 13</td>
<td>Pending</td>
<td>₹2500</td>
</tr>

<tr>
<td>FIX002</td>
<td>Aman</td>
<td>HP Laptop</td>
<td>Ready</td>
<td>₹4500</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

async function login(){

let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;

const res = await fetch("/api/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username:user,
password:pass
})

});

const data = await res.json();

if(data.success){

document.getElementById("loginScreen").style.display="none";

alert("Login Success");

}else{

alert(data.message || "Wrong Username Password");

}

}

</script>

</body>
</html>
